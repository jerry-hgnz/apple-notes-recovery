[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-notes-recovery"
version = "0.1.0"
description = "Evidence-driven Apple Notes recovery toolkit for macOS."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["apple-notes", "data-recovery", "forensics", "macos", "ocr", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Recovery Tools",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
notes-recover = "apple_notes_recovery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apple_notes_recovery = ["tools/*.swift"]
